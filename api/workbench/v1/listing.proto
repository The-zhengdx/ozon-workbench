syntax = "proto3";

package workbench.v1;

option go_package = "ozon-workbench/api/workbench/v1;v1";

// ListingService 按可售 SKU 刊登。
// 正式 HTTP 由 internal/service 实现。请求带 X-Shop-Id。
// 图床未配置时，上传本地媒体会返回 STORAGE_UNCONFIGURED，列表和编辑仍可用。
service ListingService {
  // GET /api/v1/listings?mode=offer|master|multi&q=&publish_status=&platform_status=&page=&page_size=
  rpc ListListings(ListListingsRequest) returns (ListListingsReply);
  // GET /api/v1/listings/{id}
  rpc GetListing(GetListingRequest) returns (ListingDetail);
  // POST /api/v1/listings/{id}/versions
  rpc SaveListingVersion(SaveListingVersionRequest) returns (ListingDetail);
  // POST /api/v1/listings/{id}/generate
  rpc GenerateListing(GetListingRequest) returns (ListingDetail);
  // POST /api/v1/listings/{id}/media
  rpc UploadListingMedia(GetListingRequest) returns (ListingDetail);
  // POST /api/v1/listings/publish
  rpc PublishListings(PublishListingsRequest) returns (PublishPlan);
  // GET /api/v1/listings/batches/{id}
  rpc GetPublishBatch(GetListingRequest) returns (PublishBatch);
  // POST /api/v1/listings/{id}/stocks
  rpc UpdateStock(UpdateStockRequest) returns (StockResult);
  // POST /api/v1/listings/{id}/platform
  rpc RefreshPlatform(GetListingRequest) returns (ListingDetail);
  // GET /api/v1/storage
  // POST /api/v1/storage/test
}

message ListListingsRequest {}
message ListListingsReply {}
message GetListingRequest {}
message ListingDetail {}
message SaveListingVersionRequest {}
message PublishListingsRequest {}
message PublishPlan {}
message PublishBatch {}
message UpdateStockRequest {}
message StockResult {}
