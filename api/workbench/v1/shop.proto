syntax = "proto3";

package workbench.v1;

option go_package = "ozon-workbench/api/workbench/v1;v1";

// ShopService 店铺与凭证。
// 正式 HTTP 由 internal/service 按下列路径实现。响应永不包含 API Key 明文或密文。
service ShopService {
  // GET /api/v1/shops
  rpc ListShops(ListShopsRequest) returns (ListShopsReply);
  // POST /api/v1/shops
  rpc CreateShop(CreateShopRequest) returns (ShopWriteReply);
  // GET /api/v1/shops/{id}
  rpc GetShop(GetShopRequest) returns (Shop);
  // PUT /api/v1/shops/{id}
  rpc UpdateShop(UpdateShopRequest) returns (ShopWriteReply);
  // DELETE /api/v1/shops/{id}  归档（从切换器移除，可恢复）
  rpc ArchiveShop(GetShopRequest) returns (Shop);
  // POST /api/v1/shops/{id}/restore
  rpc RestoreShop(GetShopRequest) returns (Shop);
  // POST /api/v1/shops/{id}/default
  rpc SetDefaultShop(GetShopRequest) returns (Shop);
  // POST /api/v1/shops/{id}/connection-test
  // 使用该店铺凭证调用 POST /v2/warehouse/list，并分页写入仓库缓存。
  rpc TestConnection(GetShopRequest) returns (ShopWriteReply);
}

message ListShopsRequest {}

message ListShopsReply {
  repeated Shop shops = 1;
}

message GetShopRequest {
  int64 id = 1;
}

message CreateShopRequest {
  string name = 1;
  string client_id = 2;
  string api_key = 3;
}

message UpdateShopRequest {
  int64 id = 1;
  string name = 2;
  string client_id = 3;
  // 空字符串表示沿用已保存的 API Key。
  string api_key = 4;
}

message Shop {
  int64 id = 1;
  string name = 2;
  string client_id = 3;
  // 未核实时不返回具体币种（JSON null）。
  string currency_code = 4;
  bool api_key_configured = 5;
  repeated Warehouse warehouses = 6;
  bool is_default = 7;
  bool archived = 8;
  string last_tested_at = 9;
  bool last_test_ok = 10;
  string last_test_message = 11;
  string created_at = 12;
  string updated_at = 13;
}

message Warehouse {
  int64 warehouse_id = 1;
  string name = 2;
  string status = 3;
  bool is_rfbs = 4;
  string warehouse_type = 5;
}

message ConnectionResult {
  bool ok = 1;
  string message = 2;
  int32 warehouse_count = 3;
}

message ShopWriteReply {
  Shop shop = 1;
  ConnectionResult connection = 2;
}
