services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ozon
      POSTGRES_PASSWORD: ozon
      POSTGRES_DB: ozon_workbench
    ports:
      - "5432:5432"
    volumes:
      - ozon_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozon -d ozon_workbench"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgres://ozon:ozon@postgres:5432/ozon_workbench?sslmode=disable
      OZON_CREDENTIAL_KEY: ${OZON_CREDENTIAL_KEY:-dev-only-local-key-change-me-please}
      OZON_MOCK: ${OZON_MOCK:-true}
      OZON_API_BASE: ${OZON_API_BASE:-https://api-seller.ozon.ru}
      HTTP_ADDR: 0.0.0.0:18081
    ports:
      - "18081:18081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ozon_pg:
